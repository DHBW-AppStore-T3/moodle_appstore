name: Moodle image (build, scan, push, roll out)

# Our production image of Moodle (Dockerfile at the repo root) for the k3s
# cluster. Pull requests only build and scan it; a push to dev (staging) or
# main (prod) also pushes ghcr.io/dhbw-appstore-t3/moodle_appstore:sha-<commit>
# and has the deployment repo pin its digest (k8s-bump.yml there); Argo CD of
# the environment follows. The upstream Moodle workflows (push.yml, composed.yml)
# are not run on dev; they stay manual (workflow_dispatch).
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - composer.json
      - composer.lock
      - .github/workflows/moodle-image.yml
  workflow_dispatch:

concurrency:
  group: moodle-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/dhbw-appstore-t3/moodle_appstore

jobs:
  image:
    name: Build, scan, push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # sign the image's origin (Sigstore, keyless)
      attestations: write   # store that signature with GitHub
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build (amd64, loaded for the scan)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: moodle:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: moodle:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: 1

      - name: Smoke test (extensions, config.php, router)
        run: |
          docker run --rm --entrypoint php moodle:scan -r 'foreach (["pgsql","gd","intl","zip","soap","sodium","Zend OPcache"] as $e) { if (!extension_loaded($e)) { fwrite(STDERR, "missing $e\n"); exit(1); } } echo "php ok\n";'
          docker run --rm --entrypoint php -e MOODLE_WWWROOT=https://example.org moodle:scan -l /var/www/html/config.php
          docker run --rm --entrypoint test moodle:scan -f /var/www/html/vendor/autoload.php

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short commit id
        id: short
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Push sha-<commit> (and dev|latest)
        id: push
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.short.outputs.sha }}
            ${{ env.IMAGE }}:${{ github.ref_name == 'main' && 'latest' || 'dev' }}
          cache-from: type=gha
      # Signs which repository, workflow, branch and commit built this digest (SLSA
      # build provenance, keyless); the deployment repo rolls out only images that
      # have it (.github/scripts/verify-image.sh there).
      - name: Attest the image's origin
        if: steps.push.outputs.digest != ''
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}

  k8s-rollout:
    name: Roll out on k8s
    runs-on: ubuntu-latest
    needs: [image]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    steps:
      # A one-hour token of the GitHub App "DHBW AppStore deploy" (installed only
      # on the deployment repository, Actions: write), not a personal token.
      - name: Token for the deployment repository
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: DHBW-AppStore-T3
          repositories: deployment
          permission-actions: write
      - name: Pin the new image in the deployment repo
        run: |
          gh workflow run k8s-bump.yml --repo DHBW-AppStore-T3/deployment --ref "$GITHUB_REF_NAME" \
            -f component=moodle -f tag="sha-${GITHUB_SHA::7}" -f digest="$DIGEST"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DIGEST: ${{ needs.image.outputs.digest }}
