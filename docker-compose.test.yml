services:

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: moodle
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: moodlepass
    volumes:
      - db_data_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle"]
      interval: 10s
      timeout: 5s
      retries: 5

  webserver:
    image: moodlehq/moodle-php-apache:8.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
      - moodledata_test:/var/www/moodledata
      - ./.docker/apache.conf:/etc/apache2/sites-enabled/000-default.conf:ro
      - ./config_test.php:/var/www/html/config.php:ro
    environment:
      MOODLE_DOCKER_DBTYPE: pgsql
      MOODLE_DOCKER_DBHOST: db
      MOODLE_DOCKER_DBNAME: moodle
      MOODLE_DOCKER_DBUSER: moodle
      MOODLE_DOCKER_DBPASS: moodlepass

  cron:
    image: moodlehq/moodle-php-apache:8.3
    restart: unless-stopped
    depends_on:
      - webserver
    volumes:
      - .:/var/www/html
      - moodledata_test:/var/www/moodledata
      - ./config_test.php:/var/www/html/config.php:ro
    entrypoint: >
      sh -c "while true; do
        php /var/www/html/public/admin/cli/cron.php;
        sleep 60;
      done"
    environment:
      MOODLE_DOCKER_DBTYPE: pgsql
      MOODLE_DOCKER_DBHOST: db
      MOODLE_DOCKER_DBNAME: moodle
      MOODLE_DOCKER_DBUSER: moodle
      MOODLE_DOCKER_DBPASS: moodlepass

volumes:
  db_data_test:
  moodledata_test:
