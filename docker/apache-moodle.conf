ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:8080>
    DocumentRoot /var/www/html/public
    # Moodle 5 routes pretty URLs through r.php.
    FallbackResource /r.php
    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    # Never serve the code outside public/ or dotfiles.
    <DirectoryMatch "/\.">
        Require all denied
    </DirectoryMatch>
    Header always set X-Content-Type-Options "nosniff"
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
