; Moodle's environment checks and a read-only, immutable image.
memory_limit = 512M
max_input_vars = 5000
upload_max_filesize = 256M
post_max_size = 256M
max_execution_time = 120
expose_php = Off
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
; The code never changes in a running container.
opcache.validate_timestamps = 0
